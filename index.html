<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Game Himpunan Interaktif</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<main class="container">
<header>
<h1>Game Himpunan Interaktif</h1>
<p class="subtitle">Belajar himpunan lewat kuis cepat — tema coklat.</p>
</header>


<section id="game">
<div id="info">
<div>Soal <span id="qIndex">1</span>/<span id="totalQ">5</span></div>
<div>Skor: <span id="score">0</span></div>
</div>


<div id="vennArea" aria-hidden="true">
<!-- Venn diagram will be injected here as SVG -->
</div>


<div id="questionCard" class="card">
<div id="questionText" class="question">Memuat soal...</div>
<div id="choices" class="choices"></div>
</div>


<div class="controls">
<button id="nextBtn" class="btn" disabled>Next</button>
<button id="restartBtn" class="btn secondary">Mulai Ulang</button>
</div>


<footer class="help">
<small>Tip: perhatikan diagram Venn di atas untuk beberapa soal.</small>
</footer>
</section>


<aside id="results" class="card hidden">
<h2>Hasil</h2>
<p>Total skor: <strong id="finalScore">0</strong></p>
<button id="playAgain" class="btn">Main Lagi</button>
</aside>


</main>


<script src="script.js"></script>
</body>
</html>
